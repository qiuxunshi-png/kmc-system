<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMC 后勤管理系统 v3.0 - 登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { 
      background: #0f172a; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    .bg-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.25;
      animation: float 20s infinite ease-in-out;
    }
    
    .bg-orb:nth-child(1) { width:500px;height:500px;background:#0ea5e9;top:-200px;left:-200px; }
    .bg-orb:nth-child(2) { width:400px;height:400px;background:#6366f1;bottom:-150px;right:-150px;animation-delay:-7s; }
    .bg-orb:nth-child(3) { width:300px;height:300px;background:#8b5cf6;top:50%;left:50%;animation-delay:-14s; }
    
    @keyframes float {
      0%,100% { transform: translate(0,0) scale(1); }
      33% { transform: translate(40px,-40px) scale(1.1); }
      66% { transform: translate(-30px,30px) scale(0.9); }
    }
    
    .login-box {
      position: relative;
      z-index: 10;
      width: 420px;
      background: rgba(30,41,59,0.7);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 44px 40px;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }
    
    .logo-wrap {
      width: 72px; height: 72px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, #0ea5e9, #6366f1);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
    }
    
    h1 { color: #f8fafc; font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 6px; }
    .subtitle { color: #64748b; text-align: center; font-size: 13px; margin-bottom: 32px; letter-spacing: 1px; }
    
    .field { margin-bottom: 20px; }
    .field label { display: block; color: #94a3b8; font-size: 13px; font-weight: 500; margin-bottom: 8px; }
    .input-wrap { position: relative; }
    .input-wrap svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px;height:18px;color:#475569; }
    .input-wrap input {
      width: 100%; padding: 13px 14px 13px 44px;
      background: rgba(15,23,42,0.6); border:1px solid rgba(255,255,255,0.08); border-radius:12px;
      color: #f8fafc; font-size:14px; outline:none; transition:all 0.2s;
    }
    .input-wrap input:focus { border-color:rgba(14,165,233,0.5); box-shadow:0 0 0 3px rgba(14,165,233,0.1); }
    .input-wrap input::placeholder { color: #475569; }
    
    .error-msg { 
      display:none; padding:10px 14px; margin-bottom:16px;
      background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.2); border-radius:10px;
      color:#f87171; font-size:13px; 
    }
    
    .login-btn {
      width:100%; padding:14px; border:none; border-radius:12px;
      background:linear-gradient(135deg,#0ea5e9,#6366f1);
      color:white; font-size:15px; font-weight:600; cursor:pointer;
      transition:all 0.2s; letter-spacing:4px;
    }
    .login-btn:hover { transform:translateY(-1px); box-shadow:0 8px 25px rgba(14,165,233,0.4); }
    .login-btn:disabled { opacity:0.6; cursor:not-allowed; transform:none; }
    
    .spinner { 
      display:inline-block; width:20px;height:20px; 
      border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    
    .hint { text-align:center; margin-top:20px; font-size:12px; color:#475569; }
    .hint span { color:#38bdf8; cursor:pointer; }
    
    .status { 
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
      padding:8px 16px; border-radius:8px; font-size:12px; color:#94a3b8;
      background:rgba(30,41,59,0.8); border:1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  <div class="bg-orb"></div>
  
  <div class="login-box">
    <div class="logo-wrap">
      <svg width="32" height="32" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
        <path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
      </svg>
    </div>
    <h1 data-i18n="login.title">KMC 后勤管理系统</h1>
    <p class="subtitle" data-i18n="login.subtitle">Knowledge Management Center v3.0</p>

    <!-- Language toggle -->
    <div style="text-align:center;margin-bottom:16px;">
      <button onclick="toggleLoginLang()" id="login-lang-btn" style="background:rgba(14,165,233,0.1);border:1px solid rgba(14,165,233,0.2);color:#38bdf8;padding:6px 16px;border-radius:8px;cursor:pointer;font-size:12px;font-weight:500;transition:all 0.2s;">
        🌐 <span id="login-lang-text">English</span>
      </button>
    </div>

    <div id="error-msg" class="error-msg"></div>

    <div class="field">
      <label data-i18n="login.username">用户名</label>
      <div class="input-wrap">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <input type="text" id="username" data-i18n="login.username.ph" placeholder="请输入用户名" autocomplete="username" />
      </div>
    </div>

    <div class="field">
      <label data-i18n="login.password">密码</label>
      <div class="input-wrap">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        <input type="password" id="password" data-i18n="login.password.ph" placeholder="请输入密码" autocomplete="current-password" />
      </div>
    </div>

    <button class="login-btn" id="login-btn" onclick="doLogin()">
      <span id="btn-text" data-i18n="login.btn">登 录</span>
    </button>

    <p class="hint" data-i18n="login.hint">默认账号: <span onclick="fillDemo()" style="color:#38bdf8;cursor:pointer">admin / admin123</span></p>
  </div>
  
  <div class="status" id="status" data-i18n="login.api.connecting">API: 连接中...</div>

  <script>
    // ===== i18n =====
    const LOGIN_I18N = {
      _lang: localStorage.getItem('kmc_lang') || (navigator.language.startsWith('zh') ? 'zh' : 'en'),
      _dict: {
        zh: {
          'login.title': 'KMC 后勤管理系统', 'login.subtitle': 'Knowledge Management Center v3.0',
          'login.username': '用户名', 'login.username.ph': '请输入用户名',
          'login.password': '密码', 'login.password.ph': '请输入密码',
          'login.btn': '登 录', 'login.hint': '默认账号: admin / admin123',
          'login.api.connected': '✅ API 已连接', 'login.api.disconnected': '⚠️ API 未连接 (请确保后端在 localhost:3001 运行)',
          'login.error.empty': '请输入用户名和密码', 'login.error.fail': '登录失败',
        },
        en: {
          'login.title': 'KMC Logistics System', 'login.subtitle': 'Knowledge Management Center v3.0',
          'login.username': 'Username', 'login.username.ph': 'Enter username',
          'login.password': 'Password', 'login.password.ph': 'Enter password',
          'login.btn': 'LOG IN', 'login.hint': 'Default: admin / admin123',
          'login.api.connected': '✅ API Connected', 'login.api.disconnected': '⚠️ API Disconnected (ensure backend on localhost:3001)',
          'login.error.empty': 'Please enter username and password', 'login.error.fail': 'Login failed',
        }
      },
      t(key) { return this._dict[this._lang]?.[key] || this._dict['zh']?.[key] || key; },
      applyAll() {
        document.documentElement.lang = this._lang === 'zh' ? 'zh-CN' : 'en';
        document.title = this._lang === 'zh' ? 'KMC 后勤管理系统 v3.0 - 登录' : 'KMC Logistics System v3.0 - Login';
        document.querySelectorAll('[data-i18n]').forEach(el => {
          const key = el.getAttribute('data-i18n');
          const val = this.t(key);
          if (el.tagName === 'INPUT') el.placeholder = val;
          else el.innerHTML = val;
        });
        const langText = document.getElementById('login-lang-text');
        if (langText) langText.textContent = this._lang === 'zh' ? 'English' : '中文';
      }
    };

    function toggleLoginLang() {
      LOGIN_I18N._lang = LOGIN_I18N._lang === 'zh' ? 'en' : 'zh';
      localStorage.setItem('kmc_lang', LOGIN_I18N._lang);
      LOGIN_I18N.applyAll();
    }

    LOGIN_I18N.applyAll();

    // ===== 配置 =====
    // 自动检测 API 地址：优先使用同域，否则回退到 localhost:3001
    const API_URL = (function() {
      const loc = window.location;
      if (loc.protocol === 'file:') return 'http://localhost:3001';
      // localtunnel 或其他公网域名 → 同域部署，用相对路径
      if (loc.hostname !== 'localhost' && loc.hostname !== '127.0.0.1') return '';
      // localhost 但非3001端口 → 跨端口
      if (loc.port !== '3001') return 'http://localhost:3001';
      return ''; // 同域部署
    })();

    // ===== 检查 API 连接 =====
    async function checkAPI() {
      try {
        const res = await fetch(API_URL + '/api/health');
        const data = await res.json();
        document.getElementById('status').textContent = LOGIN_I18N.t('login.api.connected') + ' (' + data.env + ')';
        document.getElementById('status').style.color = '#4ade80';
      } catch(e) {
        document.getElementById('status').textContent = LOGIN_I18N.t('login.api.disconnected');
        document.getElementById('status').style.color = '#fbbf24';
      }
    }
    checkAPI();
    
    // ===== 自动填充演示账号 =====
    function fillDemo() {
      document.getElementById('username').value = 'admin';
      document.getElementById('password').value = 'admin123';
    }
    
    // ===== 登录 =====
    async function doLogin() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error-msg');
      const btn = document.getElementById('login-btn');
      const btnText = document.getElementById('btn-text');
      
      if (!username || !password) {
        errorEl.textContent = LOGIN_I18N.t('login.error.empty');
        errorEl.style.display = 'block';
        return;
      }
      
      // 加载状态
      btn.disabled = true;
      btnText.innerHTML = '<div class="spinner"></div>';
      errorEl.style.display = 'none';
      
      try {
        const res = await fetch(API_URL + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        
        if (!res.ok) {
          throw new Error(data.error || LOGIN_I18N.t('login.error.fail'));
        }
        
        // 保存 Token 和用户信息
        localStorage.setItem('kmc_token', data.token);
        localStorage.setItem('kmc_user', JSON.stringify(data.user));
        
        // 跳转到主应用
        window.location.href = '/kmc-app-v3.html';
        
      } catch(err) {
        errorEl.textContent = err.message;
        errorEl.style.display = 'block';
      } finally {
        btn.disabled = false;
        btnText.textContent = LOGIN_I18N.t('login.btn');
      }
    }
    
    // ===== 回车登录 =====
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin();
    });
    
    // ===== 检查是否已登录 =====
    (function() {
      const token = localStorage.getItem('kmc_token');
      if (token) {
        // 已登录，跳转到主应用
        window.location.href = '/kmc-app-v3.html';
      }
    })();
  </script>
</body>
</html>
