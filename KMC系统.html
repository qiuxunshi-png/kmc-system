<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMC综合管理系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: white;
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            margin-bottom: 50px;
            font-size: 14px;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px 30px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        .card-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        .card h2 {
            font-size: 24px;
            margin-bottom: 10px;
            color: #333;
        }
        .card p {
            color: #666;
            line-height: 1.6;
            font-size: 14px;
        }
        .badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-top: 15px;
        }
        .card:first-child .badge {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .card:last-child .badge {
            background: #e3f2fd;
            color: #1565c0;
        }
        .info {
            margin-top: 40px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            color: white;
            text-align: center;
            font-size: 13px;
            line-height: 1.8;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            h1 { font-size: 36px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏢 KMC综合管理系统</h1>
        <p class="subtitle">INTEGRATED MANAGEMENT SYSTEM</p>
        
        <div class="grid">
            <div class="card" onclick="openSystem('wuzi')">
                <div class="card-icon">📦</div>
                <h2>物资管理</h2>
                <p>Logistics Management System<br>入库、出库、库存管理</p>
                <div class="badge">✅ Smart Sync v3.7</div>
            </div>
            
            <div class="card" onclick="openSystem('security')">
                <div class="card-icon">🛡️</div>
                <h2>安保管理</h2>
                <p>Security Operations Management<br>任务、督察、SOS、记录</p>
                <div class="badge">✅ SiteOps V15.0</div>
            </div>
        </div>
        
        <div class="info">
            <strong>📍 使用说明：</strong><br>
            1. 确保已连接到互联网（系统需要加载在线资源）<br>
            2. 点击上方卡片即可进入对应系统<br>
            3. 如需离线使用，请联系管理员配置本地服务器
        </div>
    </div>
    
    <script>
        function openSystem(type) {
            if (type === 'wuzi') {
                // 物资管理系统 - 在线版本
                window.open('https://qiuxunshi-png.github.io/kmc-houqinwuzi/', '_blank');
            } else if (type === 'security') {
                // 安保管理系统 - 在线版本
                window.open('https://qiuxunshi-png.github.io/kmc-Security/?v=11', '_blank');
            }
        }
        
        // 页面加载完成提示
        window.addEventListener('load', function() {
            console.log('✅ KMC综合管理系统已加载');
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.5s';
            setTimeout(() => {
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
